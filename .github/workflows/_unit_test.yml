# Reusable unit test workflow — platform-agnostic.
#
# Accepts platform config (image, labels, volumes, options) as inputs
# so it can run on any backend (CUDA, Ascend, etc.).
# Platform-specific dependencies are installed via .github/scripts/<platform>/setup.sh.

name: Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        description: "Platform name (e.g., nvidia, ascend)"
        required: true
        type: string
      ci_image:
        description: "Docker image for the test container"
        required: true
        type: string
      runner_labels:
        description: "JSON array of runner labels"
        required: true
        type: string
      container_volumes:
        description: "JSON array of volume mounts"
        required: false
        type: string
        default: "[]"
      container_options:
        description: "Docker container options string"
        required: false
        type: string
        default: ""
      upload_coverage:
        description: "Whether to publish coverage to FlagCICD (audit artifacts are always retained)"
        required: false
        type: boolean
        default: true
    secrets:
      FLAGCICD_API_TOKEN:
        required: false

jobs:
  unit-tests:
    name: Unit tests (${{ inputs.platform }})
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    container:
      image: ${{ inputs.ci_image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}

    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Check device availability
        run: bash .github/scripts/${{ inputs.platform }}/check.sh

      - name: Install project
        run: bash .github/scripts/${{ inputs.platform }}/setup.sh

      - name: Run unit tests
        id: unit
        run: |
          python tests/run.py \
            --platform ${{ inputs.platform }} \
            --scope unit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-${{ inputs.platform }}
          path: |
            coverage-${{ inputs.platform }}.json
            report-${{ inputs.platform }}.json

      - name: Check FlagCICD authentication
        id: flagcicd
        if: ${{ success() && inputs.upload_coverage && hashFiles(format('coverage-{0}.json', inputs.platform)) != '' }}
        env:
          FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
        run: |
          if [ -n "${FLAGCICD_API_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FlagCICD upload skipped: credentials are unavailable. Reports remain in the artifact."
          fi

      - name: Upload coverage report to FlagCICD
        if: ${{ success() && inputs.upload_coverage && hashFiles(format('coverage-{0}.json', inputs.platform)) != '' && steps.unit.outcome == 'success' && steps.flagcicd.outputs.configured == 'true' }}
        uses: flagos-ai/FlagOps/actions/post-pytest-report@v2
        continue-on-error: true
        with:
          backend_url: 'https://flagcicd.flagos.net/flagcicd/api/v1/cicd/metrics/'
          api_token: ${{ secrets.FLAGCICD_API_TOKEN }}
          report_path: 'coverage-${{ inputs.platform }}.json'
          file_type: coverage
          job_name: 'coverage-${{ inputs.platform }}-unit'
          fail_on_error: 'false'
